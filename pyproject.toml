[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-sentinel"
version = "0.1.0"
description = "Measuring whether drift detectors actually predict model failure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JAI", email = "jai19kharb@gmail.com" }]

[project.urls]
Repository = "https://github.com/jboiie/drift-sentinel"

# Core: everything needed to produce the findings in README Tables 1-4.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "jinja2>=3.1",
    "plotly>=5.18",
    "kaleido>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# External comparison baselines. Required for Table 2/3 to be externally anchored.
baselines = [
    "nannyml>=0.11",
    "evidently>=0.4",
]
# Stretch: model server only. The dashboard is core (Phase D) and needs
# nothing beyond jinja2 + plotly + kaleido, already in dependencies.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.4",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
sentinel = "sentinel.runner:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sentinel --cov-report=term-missing"
