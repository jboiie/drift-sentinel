[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-sentinel"
version = "0.1.0"
description = "Catching an LLM support agent's answers drifting away from ground truth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JAI", email = "jai19kharb@gmail.com" }]

# Core: everything needed to run the drift checks and the sampler.
dependencies = [
    "google-genai>=0.5",
    "openai>=1.50",
    "ragas>=0.2",
    "langchain-community<0.4",  # ragas imports langchain_community.chat_models.vertexai directly; removed in 0.4
    "pydantic>=2.4",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/jboiie/drift-sentinel"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[tool.setuptools]
packages = ["agent", "drift", "judge"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
